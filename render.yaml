# Blueprint Render per IMI Music (API NestJS + Web Next.js).
#
# Il database NON viene creato qui: si usa lo stesso PostgreSQL (Neon) già in
# uso in locale, così i dati sono gli stessi da PC e da telefono. La stringa di
# connessione va incollata a mano nel pannello Render (è marcata `sync: false`,
# quindi non finisce mai nel repository).
#
# Deploy: render.com → New → Blueprint → repo imi-music → Apply.
#
# ⚠️ File caricati: sul piano free il disco di Render è effimero (i file si
# perdono a ogni riavvio). Per l'area file in produzione serve un disco
# persistente (piano a pagamento) oppure object storage S3/R2.

services:
  # --- API (NestJS) ---
  - type: web
    name: imi-api
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: >-
      npm install -g pnpm@9.12.0 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @imi/db generate &&
      pnpm --filter @imi/shared build &&
      pnpm --filter @imi/db build &&
      pnpm --filter @imi/api build
    startCommand: >-
      pnpm --filter @imi/db exec prisma migrate deploy &&
      pnpm --filter @imi/db seed &&
      pnpm --filter @imi/api start
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      # Stessa stringa di connessione Neon usata in locale (senza -pooler).
      # Da incollare nel pannello Render: Environment → DATABASE_URL.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: DEFAULT_TENANT_ID
        value: 00000000-0000-0000-0000-000000000000
      # Dati reali: nessun dato demo in produzione.
      - key: SEED_DEMO
        value: 'false'
      # Password dell'admin creato/aggiornato dal seed a ogni avvio.
      # Impostala nel pannello Render prima del primo deploy.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Email transazionale (facoltativa): senza chiave le notifiche
      # restano solo in-app.
      - key: RESEND_API_KEY
        sync: false

  # --- Web (Next.js) ---
  - type: web
    name: imi-web
    runtime: node
    plan: free
    buildCommand: >-
      npm install -g pnpm@9.12.0 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @imi/shared build &&
      pnpm --filter @imi/web build
    startCommand: pnpm --filter @imi/web start
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      # Origine dell'API: il web fa da proxy verso questo host (next.config.mjs).
      - key: API_ORIGIN
        fromService:
          name: imi-api
          type: web
          property: host
